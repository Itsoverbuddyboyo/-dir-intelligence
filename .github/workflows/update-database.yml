name: Update D.I.R. Intelligence

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dir-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download MalwareBazaar intelligence
        env:
          MB_AUTH_KEY: ${{ secrets.MB_AUTH_KEY }}
        run: python update_database.py

      - name: Publish updated database
        run: |
          git config user.name "DIR Intelligence Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add hashes.json

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update malware intelligence database"
            git push
          fi
